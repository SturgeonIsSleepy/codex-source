name: Publish verified handoff archives
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and publish the recorded transfer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_handoff_assets.py
