name: ePlayer preview
on:
  push:
    paths:
      - 'projects/eplayer/**'
      - '!projects/eplayer/docs/**'
      - '!projects/eplayer/*.md'
      - '.github/scripts/run_eplayer_device_checks.py'
      - '.github/workflows/eplayer-preview.yml'
  workflow_dispatch:
concurrency:
  group: eplayer-${{ github.ref }}
  # Complete active device checks; queue the next source checkpoint instead of erasing evidence.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/eplayer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Restore checksummed native libraries
        run: |
          base=https://github.com/SturgeonIsSleepy/codex-source/releases/download/eplayer-v0.1.0
          curl -fLsS "$base/eplayer-v0.1.0-native-libs.tar.gz" -o "$RUNNER_TEMP/eplayer-v0.1.0-native-libs.tar.gz"
          curl -fLsS "$base/SHA256SUMS" -o "$RUNNER_TEMP/SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep ' eplayer-v0.1.0-native-libs.tar.gz$' SHA256SUMS | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/eplayer-v0.1.0-native-libs.tar.gz"
      - name: Build preview and device tests
        run: |
          bash tools/prepare-local-signing.sh
          bash gradlew testStandardFastReleaseUnitTest assembleStandardFastRelease assembleInternalFastRelease assembleStandardFastReleaseAndroidTest -PwithRust=false -PtestBuildType=fastRelease --console=plain
      - name: Upload early fast validation candidates
        if: github.ref == 'refs/heads/codex/eplayer-light' || github.ref == 'refs/heads/codex/eplayer-power'
        uses: actions/upload-artifact@v4
        with:
          name: eplayer-fast-${{ github.sha }}
          path: |
            projects/eplayer/app/build/outputs/apk/standard/fastRelease/*x86_64*.apk
            projects/eplayer/app/build/outputs/apk/androidTest/standard/fastRelease/*.apk
          if-no-files-found: error
      - name: Build shrunk release candidates
        if: github.ref == 'refs/heads/codex/eplayer-power' || github.ref == 'refs/heads/codex/eplayer-light' || github.ref == 'refs/heads/codex/ncm-basic-completion' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch'
        run: bash gradlew assembleStandardRelease assembleInternalRelease -PwithRust=false --console=plain
      - name: Upload preview and device tests
        uses: actions/upload-artifact@v4
        with:
          name: eplayer-preview-${{ github.sha }}
          path: |
            projects/eplayer/app/build/outputs/apk/standard/release/*universal*.apk
            projects/eplayer/app/build/outputs/apk/standard/release/*x86_64*.apk
            projects/eplayer/app/build/outputs/apk/internal/release/*universal*.apk
            projects/eplayer/app/build/outputs/apk/internal/release/*x86_64*.apk
            projects/eplayer/app/build/outputs/apk/standard/fastRelease/*universal*.apk
            projects/eplayer/app/build/outputs/apk/standard/fastRelease/*x86_64*.apk
            projects/eplayer/app/build/outputs/apk/internal/fastRelease/*universal*.apk
            projects/eplayer/app/build/outputs/apk/internal/fastRelease/*x86_64*.apk
            projects/eplayer/app/build/outputs/apk/androidTest/standard/fastRelease/*.apk
          if-no-files-found: error
  device-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: eplayer-preview-${{ github.sha }}
          path: device-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify standard playback and responsive layout on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EPLAYER_CHECK_RELEASE: ${{ (github.ref == 'refs/heads/codex/eplayer-power' || github.ref == 'refs/heads/codex/eplayer-light' || github.ref == 'refs/heads/codex/ncm-basic-completion' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 .github/scripts/run_eplayer_device_checks.py
      - name: Preserve device results and component renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eplayer-device-checks-${{ github.sha }}
          path: device-evidence/
          if-no-files-found: warn
