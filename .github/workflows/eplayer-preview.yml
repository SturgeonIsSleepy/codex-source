name: ePlayer preview
on:
  push:
    paths:
      - 'projects/eplayer/**'
      - '!projects/eplayer/docs/**'
      - '!projects/eplayer/*.md'
      - '.github/scripts/run_eplayer_device_checks.py'
      - '.github/scripts/collect_eplayer_native.py'
      - '.github/workflows/eplayer-preview.yml'
  workflow_dispatch:
concurrency:
  group: eplayer-${{ github.ref }}
  # Complete active device checks; queue the next source checkpoint instead of erasing evidence.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/eplayer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Install native binding prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Cache native dependencies and compiler output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            projects/eplayer/app/src/main/rust/target
          key: ${{ runner.os }}-eplayer-native-v1-ndk4.1.2-${{ hashFiles('projects/eplayer/app/src/main/rust/Cargo.lock') }}
      - name: Build matching native libraries from source
        working-directory: projects/eplayer/app/src/main/rust
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          if ! command -v cargo-ndk >/dev/null; then cargo install cargo-ndk --version 4.1.2 --locked; fi
          mkdir -p ../../../build/native-evidence
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 28 -o ../jniLibs build --locked --release 2>&1 | tee ../../../build/native-evidence/build.log
      - name: Verify native ABI exports and source provenance
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          python3 ../../.github/scripts/collect_eplayer_native.py --native-dir app/src/main/jniLibs --output app/build/native-evidence/provenance.json
      - name: Preserve native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eplayer-native-${{ github.sha }}
          path: |
            projects/eplayer/app/src/main/jniLibs/**/*.so
            projects/eplayer/app/build/native-evidence/
          if-no-files-found: warn
      - name: Build preview and device tests
        run: |
          bash tools/prepare-local-signing.sh
          bash gradlew testStandardFastReleaseUnitTest assembleStandardFastRelease assembleInternalFastRelease assembleStandardFastReleaseAndroidTest -PwithRust=false -PtestBuildType=fastRelease --console=plain
      - name: Upload early fast validation candidates
        if: github.ref == 'refs/heads/codex/eplayer-light'
        uses: actions/upload-artifact@v4
        with:
          name: eplayer-fast-${{ github.sha }}
          path: |
            projects/eplayer/app/build/outputs/apk/standard/fastRelease/*x86_64*.apk
            projects/eplayer/app/build/outputs/apk/androidTest/standard/fastRelease/*.apk
          if-no-files-found: error
      - name: Build shrunk release candidates
        if: github.ref == 'refs/heads/codex/eplayer-light' || github.ref == 'refs/heads/codex/ncm-basic-completion' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch'
        run: bash gradlew assembleStandardRelease assembleInternalRelease -PwithRust=false --console=plain
      - name: Upload preview and device tests
        uses: actions/upload-artifact@v4
        with:
          name: eplayer-preview-${{ github.sha }}
          path: |
            projects/eplayer/app/build/outputs/apk/standard/release/*universal*.apk
            projects/eplayer/app/build/outputs/apk/standard/release/*x86_64*.apk
            projects/eplayer/app/build/outputs/apk/internal/release/*universal*.apk
            projects/eplayer/app/build/outputs/apk/internal/release/*x86_64*.apk
            projects/eplayer/app/build/outputs/apk/standard/fastRelease/*universal*.apk
            projects/eplayer/app/build/outputs/apk/standard/fastRelease/*x86_64*.apk
            projects/eplayer/app/build/outputs/apk/internal/fastRelease/*universal*.apk
            projects/eplayer/app/build/outputs/apk/internal/fastRelease/*x86_64*.apk
            projects/eplayer/app/build/outputs/apk/androidTest/standard/fastRelease/*.apk
          if-no-files-found: error
  device-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: eplayer-preview-${{ github.sha }}
          path: device-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify standard playback and responsive layout on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EPLAYER_CHECK_RELEASE: ${{ (github.ref == 'refs/heads/codex/eplayer-light' || github.ref == 'refs/heads/codex/ncm-basic-completion' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 .github/scripts/run_eplayer_device_checks.py
      - name: Preserve device results and component renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eplayer-device-checks-${{ github.sha }}
          path: device-evidence/
          if-no-files-found: warn
