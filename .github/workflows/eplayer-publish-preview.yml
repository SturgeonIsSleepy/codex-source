name: Publish verified ePlayer preview # exact CI candidate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/eplayer-publish-preview.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: eplayer-v0.3.0-delivery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: eplayer-preview-a62e0fb60a1aa3215cbb924f5204698153cc738f
          run-id: 40222561908
          github-token: ${{ github.token }}
          path: delivery-input
      - name: Prepare the unchanged verified candidate
        run: python3 .github/scripts/publish_eplayer_preview.py prepare
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify exact universal delivery APK on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 .github/scripts/publish_eplayer_preview.py smoke
      - name: Archive evidence and publish only after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_eplayer_preview.py publish
      - name: Preserve delivery evidence even when publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eplayer-v0.3.0-delivery-${{ github.run_id }}
          path: |
            device-evidence/
            delivery/*.json
            delivery/*.md
            delivery/SHA256SUMS
          if-no-files-found: warn
