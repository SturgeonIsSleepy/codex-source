import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias libs.plugins.android.application
    alias libs.plugins.jetbrains.kotlin.plugin.compose


}

// 动态版本号：基于 git tag 和 commit count（兼容 configuration cache）
def gitShaProvider = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
    workingDir = rootDir
}.standardOutput.asText.map { it.trim() }

def gitVersionCodeProvider = providers.exec {
    commandLine 'git', 'rev-list', '--count', 'HEAD'
    workingDir = rootDir
}.standardOutput.asText.map { it.trim().toInteger() }

def gitDescribeProvider = providers.exec {
    commandLine 'git', 'describe', '--tags', '--always'
    workingDir = rootDir
}.standardOutput.asText.map { it.trim() }

// 在 defaultConfig 中使用这些 provider 值
def resolvedSha = gitShaProvider.getOrElse('unknown')
// The transferred preview has versionCode 6; a new repository must not downgrade it.
def resolvedVersionCode = Math.max(6, gitVersionCodeProvider.getOrElse(1))
def resolvedDescribe = gitDescribeProvider.getOrElse('')
def resolvedVersionName = resolvedDescribe.matches('^v?\\d+.*') ? resolvedDescribe.replaceFirst(/^v/, '') : "1.0.${resolvedVersionCode}"

android {
    namespace 'cp.player'
    // Run the same device checks against the non-debuggable fast build when needed.
    testBuildType = providers.gradleProperty('testBuildType').getOrElse('debug')
    compileSdk 37
    compileSdkMinor 0
    buildToolsVersion "36.0.0"

    signingConfigs {
        def commonSigningConfig = {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        debug(commonSigningConfig)
        release {
            // CI 环境：从 Gradle properties 读取签名配置（-P 参数传入）
            def storeFilePath = findProperty('RELEASE_STORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword findProperty('RELEASE_STORE_PASSWORD')
                keyAlias findProperty('RELEASE_KEY_ALIAS')
                keyPassword findProperty('RELEASE_KEY_PASSWORD')
            } else {
                // 本地开发：使用 debug keystore
                storeFile file('../debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId "app.eplayer.music"
        minSdk 28
        targetSdk 36
        versionCode resolvedVersionCode
        versionName "0.6.2"
        buildConfigField "String", "GIT_SHA", "\"${resolvedSha}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        resConfigs "en", "zh", "ja"
    }

    flavorDimensions += "distribution"
    productFlavors {
        standard {
            dimension "distribution"
            buildConfigField "boolean", "INTERNAL_BUILD", "false"
            manifestPlaceholders = [distributionLabel: "ePlayer"]
        }
        internal {
            dimension "distribution"
            applicationIdSuffix ".internal"
            versionNameSuffix "-internal"
            buildConfigField "boolean", "INTERNAL_BUILD", "true"
            manifestPlaceholders = [distributionLabel: "ePlayer 自用"]
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            crunchPngs false
        }
        // 快速编译且具备接近 release 的运行性能（关闭 R8 压缩，关闭 debuggable，适用于 Compose 性能调试）
        fastRelease {
            initWith release
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
            freeCompilerArgs.add("-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi")
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        jniLibs.useLegacyPackaging = false
        // Dependencies also ship x86 helpers; ePlayer's native engine supports the three ABIs above.
        jniLibs.excludes += ['lib/x86/**']
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE*'
            excludes += 'META-INF/NOTICE*'
            excludes += 'META-INF/*.kotlin_module'
        }
    }
}

